services:

  postgres:
    image: postgres:15-alpine
    container_name: piped-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: piped
      POSTGRES_USER: piped
      POSTGRES_PASSWORD: Piped-QNAP-2026-ChangeMe

    volumes:
      - /share/Container/piped/data/postgres:/var/lib/postgresql/data

    networks:
      - piped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piped -d piped"]
      interval: 10s
      timeout: 5s
      retries: 10


  piped-bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: piped-bgutil
    restart: unless-stopped

    networks:
      - piped


  piped-resolver:
    image: ghcr.io/antonio-bravo/piped-youtube/piped-resolver:latest
    pull_policy: always
    container_name: piped-resolver
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    environment:
      RESOLVER_HOST: "0.0.0.0"
      RESOLVER_PORT: "8000"

      # URL pública del proxy de medios que devuelve el resolver en la respuesta de streams
      PROXY_URL: "http://125.125.125.125:18080/proxy"

      # Base pública para reescribir manifiestos HLS de directos (/relay)
      RESOLVER_PUBLIC_URL: "http://125.125.125.125:18080/api"

      # Configuración de caché
      CACHE_TTL: "3600"
      CACHE_MAXSIZE: "512"
      ALLOWED_ORIGINS: "*"

      # Conexión con el proveedor de tokens POT (bgutil)
      BGUTIL_BASE_URL: "http://piped-bgutil:4416"

    depends_on:
      - piped-bgutil
      - piped-proxy

    networks:
      - piped


  piped-backend:
    image: 1337kavin/piped:latest
    container_name: piped-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - /share/Container/piped/config/config.properties:/app/config.properties:ro

    networks:
      - piped


  piped-proxy:
    image: 1337kavin/piped-proxy:latest
    container_name: piped-proxy
    restart: unless-stopped

    environment:
      UDS: "0"

    networks:
      - piped


  piped-frontend:
    image: 1337kavin/piped-frontend:latest
    container_name: piped-frontend
    restart: unless-stopped
    user: root

    environment:
      BACKEND_HOSTNAME: pipedapi.kavin.rocks
      HTTP_MODE: http

    depends_on:
      - piped-backend

    networks:
      - piped


  nginx:
    image: nginx:mainline-alpine
    container_name: piped-nginx
    restart: unless-stopped

    depends_on:
      - piped-backend
      - piped-resolver
      - piped-proxy
      - piped-frontend

    ports:
      - "18080:80"

    volumes:
      - /share/Container/piped/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /share/Container/piped/config/pipedfrontend.conf:/etc/nginx/conf.d/pipedfrontend.conf:ro
      - /share/Container/piped/config/ytproxy.conf:/etc/nginx/snippets/ytproxy.conf:ro

    networks:
      - piped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: piped-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Madrid
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      # Ejecuta la comprobación los domingos a las 06:30 hora peninsular (05:30 UTC)
      - WATCHTOWER_SCHEDULE=0 30 6 * * 0
    networks:
      - piped

networks:
  piped:
    name: piped
    driver: bridge
