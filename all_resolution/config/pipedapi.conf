upstream piped_backend {
    server piped-backend:8080;
}

 upstream piped_resolver {
    server piped-resolver:8000;
 }


server {
    listen 80;
    server_name pipedapi.home;

        # /streams se resuelve mediante yt-dlp + bgutil
        
    location /streams {
        proxy_pass http://piped_resolver;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    location / {
        proxy_pass http://piped_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}