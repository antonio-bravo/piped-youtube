upstream piped_backend {
    server piped-backend:8080;
}

 upstream piped_resolver {
    server piped-resolver:8000;
 }


server {
    listen 80;
    server_name pipedapi.home;

        # /streams se resuelve mediante yt-dlp + bgutil
        
    location /streams {
        proxy_pass http://piped_resolver;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # El resolver (FastAPI CORSMiddleware) ya añade estas cabeceras;
        # ocultarlas evita duplicados y forzamos las nuestras, válidas
        # también en respuestas de error (502/504) generadas por nginx.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Headers * always;
    }

    # Reescritura de manifiestos/segmentos HLS para directos (livestreams).
    location /relay {
        proxy_pass http://piped_resolver;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Headers * always;
    }
    
    location / {
        proxy_pass http://piped_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}