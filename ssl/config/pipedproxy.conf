upstream piped_proxy {
    server piped-proxy:8080;
}

server {
    listen 443 ssl; # 🔄 CAMBIADO listen 80;
    server_name pipedproxy.home;
    
    # 🔑 RUTAS CERTIFICADOS
    ssl_certificate /etc/ssl/certs-custom/piped.crt;
    ssl_certificate_key /etc/ssl/certs-custom/piped.key;

    # 🔒 CONFIGURACIÓN SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location ~ (/videoplayback|/api/v4/|/api/manifest/) {
        include /etc/nginx/snippets/ytproxy.conf;
        add_header Cache-Control private always;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location / {
        include /etc/nginx/snippets/ytproxy.conf;
        add_header Cache-Control "public, max-age=604800";
        proxy_hide_header Access-Control-Allow-Origin;
    }
}