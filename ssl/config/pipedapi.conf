upstream piped_backend {
    server piped-backend:8080;
}

server {
    listen 433 ssl; # cambiado a SSL listen 80;
    server_name pipedapi.home;

    # 🔑 RUTAS CERTIFICADOS
    ssl_certificate /etc/ssl/certs-custom/piped.crt;
    ssl_certificate_key /etc/ssl/certs-custom/piped.key;

    # 🔒 CONFIGURACIÓN SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
        
    location / {
        proxy_pass http://piped_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}