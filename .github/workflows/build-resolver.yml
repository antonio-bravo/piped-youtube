name: Build and Push Piped Resolver

on:
  workflow_dispatch:
    inputs:
      upgrade_ytdlp:
        description: 'Forzar actualización de yt-dlp a la última versión disponible'
        required: false
        type: boolean
        default: true
      keepLatestNoOfDockerImages:
        description: 'Número de versiones recientes a mantener en GHCR'
        required: false
        type: number
        default: 10
  push:
    branches:
      - main
    paths:
      - 'all_resolution/resolver-source/resolver/**'
      - '.github/workflows/build-resolver.yml'
  schedule:
    # Ejecutar todos los sábados a las 03:00 UTC para mantener yt-dlp actualizado automáticamente
    - cron: '0 3 * * 6'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      docker_image_name: 'piped-youtube/piped-resolver'
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo_case
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/piped-resolver
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./all_resolution/resolver-source/resolver
          file: ./all_resolution/resolver-source/resolver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old image versions in GHCR
        uses: actions/delete-package-versions@v5
        if: ${{ inputs.keepLatestNoOfDockerImages == null || inputs.keepLatestNoOfDockerImages > 0 }}
        with:
          package-name: ${{ env.docker_image_name }}
          package-type: 'container'
          min-versions-to-keep: ${{ inputs.keepLatestNoOfDockerImages || 10 }}
